name: Build Custom Images (AWS & GCP)

on:
  pull_request:
    types: [closed]
    branches: ["upstream"]

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run Integration Tests
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run Tests
        run: npm test

      - name: Build Application Artifact (webapp.zip)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip
          zip -r webapp.zip . \
            -x "node_modules/*" \
               ".git/*" \
               ".github/*" \
               "packer/*" \
               "coverage/*" \
               "*.log" \
               ".env" \
               ".env.*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: webapp.zip

  build-aws-ami:
    name: Build AWS AMI in DEV
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: integration-tests

    outputs:
      ami_id: ${{ steps.capture_ami.outputs.ami_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact
          path: .

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: "1.10.3"

      - name: Configure DEV AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Packer Init
        run: packer init packer/packer.pkr.hcl

      - name: Packer Build (AWS only)
        run: |
          packer build \
            -only=amazon-ebs.aws_ubuntu_2404 \
            -var "app_artifact=./webapp.zip" \
            -var "aws_demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "gcp_project_id=dummy-project" \
            packer/packer.pkr.hcl | tee packer-output.log

      - name: Capture AMI ID
        id: capture_ami
        run: |
          AMI_ID=$(grep -o 'ami-[a-zA-Z0-9]\+' packer-output.log | tail -1)
          if [ -z "$AMI_ID" ]; then
            echo "Failed to capture AMI ID from packer output"
            exit 1
          fi
          echo "Captured AMI ID: $AMI_ID"
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for AMI to become available in DEV
        run: |
          aws ec2 wait image-available --image-ids "${{ steps.capture_ami.outputs.ami_id }}"

  deploy-to-demo:
    name: Deploy to DEMO via Launch Template + Instance Refresh
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: build-aws-ami

    steps:
      - name: Configure DEMO AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}

      - name: Verify DEMO account and continue
        run: |
          echo "DEMO caller identity:"
          aws sts get-caller-identity

          echo "AWS region: $AWS_REGION"
          echo "AMI ID from DEV build: ${{ needs.build-aws-ami.outputs.ami_id }}"

          echo "Sleeping briefly for share propagation..."
          sleep 60

      - name: Get Launch Template ID and ASG name
        id: get_infra
        run: |
          LT_ID=$(aws ec2 describe-launch-templates \
            --filters "Name=launch-template-name,Values=csye6225-demo-lt*" \
            --query 'LaunchTemplates[0].LaunchTemplateId' \
            --output text)

          if [ -z "$LT_ID" ] || [ "$LT_ID" = "None" ]; then
            echo "Launch Template not found in DEMO"
            exit 1
          fi

          echo "Launch Template ID: $LT_ID"
          echo "lt_id=$LT_ID" >> $GITHUB_OUTPUT

          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'csye6225-demo-asg')].AutoScalingGroupName | [0]" \
            --output text)

          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" = "None" ]; then
            echo "Auto Scaling Group not found in DEMO"
            exit 1
          fi

          echo "ASG Name: $ASG_NAME"
          echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT

      - name: Create new Launch Template version with latest AMI
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-id "${{ steps.get_infra.outputs.lt_id }}" \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"${{ needs.build-aws-ami.outputs.ami_id }}\"}"

      - name: Update ASG to use latest Launch Template version
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "${{ steps.get_infra.outputs.asg_name }}" \
            --launch-template "LaunchTemplateId=${{ steps.get_infra.outputs.lt_id }},Version=\$Latest"

      - name: Trigger instance refresh
        id: refresh
        run: |
          EXISTING=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "${{ steps.get_infra.outputs.asg_name }}" \
            --query 'InstanceRefreshes[?Status==`InProgress`].InstanceRefreshId' \
            --output text)

          if [ ! -z "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
            echo "Cancelling existing refresh: $EXISTING"
            aws autoscaling cancel-instance-refresh \
              --auto-scaling-group-name "${{ steps.get_infra.outputs.asg_name }}"
            sleep 30
          fi

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ steps.get_infra.outputs.asg_name }}" \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":180}' \
            --query 'InstanceRefreshId' \
            --output text)

          if [ -z "$REFRESH_ID" ] || [ "$REFRESH_ID" = "None" ]; then
            echo "Failed to start instance refresh"
            exit 1
          fi

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      - name: Wait for instance refresh to complete
        run: |
          ASG_NAME="${{ steps.get_infra.outputs.asg_name }}"
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          echo "Waiting for instance refresh $REFRESH_ID to complete..."

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh failed with status: $STATUS"
              exit 1
            fi

            sleep 30
          done

  build-gcp-image:
    name: Build GCP Image (Packer)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Check GCP Secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || \
             [ -z "${{ secrets.GCP_DEV_PROJECT_ID }}" ] || \
             [ -z "${{ secrets.GCP_DEMO_PROJECT_NUMBER }}" ]; then
            echo "GCP secrets not set (need GCP_SA_KEY, GCP_DEV_PROJECT_ID, GCP_DEMO_PROJECT_NUMBER). Skipping GCP image build."
            exit 0
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact
          path: .

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: "1.10.3"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Packer Init
        run: packer init packer/packer.pkr.hcl

      - name: Packer Build (GCP only)
        run: |
          packer build \
            -only=googlecompute.gcp_ubuntu_2404 \
            -var "app_artifact=./webapp.zip" \
            -var "gcp_project_id=${{ secrets.GCP_DEV_PROJECT_ID }}" \
            -var "aws_demo_account_id=000000000000" \
            packer/packer.pkr.hcl

      - name: Share latest image family with DEMO project
        run: |
          set -euo pipefail

          DEV_PROJECT="${{ secrets.GCP_DEV_PROJECT_ID }}"
          DEMO_PROJECT_NUMBER="${{ secrets.GCP_DEMO_PROJECT_NUMBER }}"

          IMAGE_NAME="$(gcloud compute images list \
            --project "$DEV_PROJECT" \
            --filter="family=csye6225" \
            --sort-by="~creationTimestamp" \
            --limit=1 \
            --format="value(name)")"

          if [ -z "$IMAGE_NAME" ]; then
            echo "No image found in family csye6225 in project $DEV_PROJECT"
            exit 1
          fi

          echo "Sharing image $IMAGE_NAME with DEMO project's default compute service account..."

          gcloud compute images add-iam-policy-binding "$IMAGE_NAME" \
            --project "$DEV_PROJECT" \
            --member="serviceAccount:${DEMO_PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/compute.imageUser"
