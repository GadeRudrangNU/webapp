name: Build Custom Images (AWS & GCP)

on:
  pull_request:
    types: [closed]
    branches: ["upstream"]

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run Integration Tests
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run Tests
        run: npm test

      - name: Build Application Artifact (webapp.zip)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip
          zip -r webapp.zip . \
            -x "node_modules/*" \
               ".git/*" \
               ".github/*" \
               "packer/*" \
               "coverage/*" \
               "*.log" \
               ".env" \
               ".env.*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: webapp.zip

  build-aws-ami:
    name: Build AWS AMI (Packer)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact
          path: .

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: "1.10.3"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_PACKER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PACKER_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Packer Init
        run: packer init packer/packer.pkr.hcl

      - name: Packer Build (AWS only)
        run: |
          packer build \
            -only=amazon-ebs.aws_ubuntu_2404 \
            -var "app_artifact=./webapp.zip" \
            -var "aws_demo_account_id=${{ secrets.AWS_DEMO_ACCOUNT_ID }}" \
            -var "gcp_project_id=dummy-project" \
            packer/packer.pkr.hcl

  build-gcp-image:
    name: Build GCP Image (Packer)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Check GCP Secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_DEV_PROJECT_ID }}" ]; then
            echo "GCP secrets not set. Skipping GCP image build."
            exit 0
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact
          path: .

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: "1.10.3"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Packer Init
        run: packer init packer/packer.pkr.hcl

      - name: Packer Build (GCP only)
        run: |
          packer build \
            -only=googlecompute.gcp_ubuntu_2404 \
            -var "app_artifact=./webapp.zip" \
            -var "gcp_project_id=${{ secrets.GCP_DEV_PROJECT_ID }}" \
            -var "aws_demo_account_id=000000000000" \
            packer/packer.pkr.hcl
